<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e05297">
<meta name="description" content="引っ越し先の部屋に家具を置いて、上から(2D)と部屋の中(3D)で確認できるレイアウトシミュレーター">
<title>おへやレイアウト</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="top">
  <div class="seg" id="modeSeg">
    <button data-mode="2d" class="on">上から見る</button>
    <button data-mode="3d">部屋の中を見る</button>
  </div>
  <div class="seg small" id="planSeg"></div>
</header>
<div class="roombar"><button id="roomBtn" title="お部屋を切り替え">🏠 <span id="roomName"></span> ▾</button><span class="notice">⚠ 寸法は概算。契約前に実寸を確認してね</span></div>

<main id="stage">
  <section id="view2d" class="view on">
    <canvas id="canvas2d"></canvas>
    <div class="status" id="status"></div>
    <div class="undo-bar">
      <button id="undoBtn" title="元に戻す (Ctrl+Z)" aria-label="元に戻す" disabled>↶</button>
      <button id="redoBtn" title="やり直す (Ctrl+Y)" aria-label="やり直す" disabled>↷</button>
    </div>
    <div class="float-tools" id="quickTools" hidden>
      <button data-act="rot90" title="90度回転">⟳ 90°</button>
      <button data-act="dup">複製</button>
      <button data-act="del" class="danger">削除</button>
    </div>
    <div class="fabs">
      <button class="fab" data-shot title="今の画面を画像で保存 (P)" aria-label="画像で保存">📷</button>
      <button class="fab" id="fitBtn" title="全体を表示" aria-label="全体を表示">⤢</button>
    </div>
    <div class="toolbar" id="toolbar" hidden></div>
  </section>
  <section id="view3d" class="view">
    <div class="presets" id="presets">
      <button data-p="light" id="lightBtn">☀ 昼</button>
      <button data-p="orbit" data-cam>🔭 俯瞰</button>
      <button data-p="top" data-cam>⬇ 真上</button>
      <button data-p="entrance" data-cam>🚪 玄関から</button>
      <button data-p="window" data-cam>🪟 窓側から</button>
      <button data-p="bed" data-cam>🛏 ベッドに座る</button>
      <button data-p="sofa" data-cam>🛋 ソファに座る</button>
    </div>
    <div class="joystick" id="joystick"><div class="knob"></div></div>
    <div class="hint3d" id="hint3d"></div>
    <div class="fabs">
      <button class="fab" id="lightFab" title="照明の切り替え (L)" aria-label="照明の切り替え">☀</button>
      <button class="fab" data-shot title="今の画面を画像で保存 (P)" aria-label="画像で保存">📷</button>
    </div>
    <div class="loading" id="loading3d" hidden>3Dを準備中…</div>
    <div class="toast" id="toast" hidden></div>
  </section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-head"><span id="sheetTitle"></span><button id="sheetClose" aria-label="閉じる">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="item">選んだ家具</button>
  <button data-tab="add">＋家具を追加</button>
  <button data-tab="room">部屋の設定</button>
  <button data-tab="more">見た目・保存</button>
</nav>
<div class="ask" id="ask" hidden>
  <div class="ask-box"><p id="askMsg"></p><input id="askInput" class="ask-input" hidden><div class="row"><button class="btn" id="askNo">やめる</button><button class="btn primary" id="askYes">OK</button></div></div>
</div>
<div class="compare" id="compare" hidden>
  <div class="cmp-box">
    <div class="sheet-head"><span class="cmp-title">案を比べる</span><button data-close aria-label="閉じる">✕</button></div>
    <div class="cmp-grid"></div>
  </div>
</div>
<div class="flash" id="flash" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
